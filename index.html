<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/566/566294.png">
</head>
<body>
    <h1>Tic-Tac-Toe</h1>
    <div id="container">
        <button id="one"></button>
        <button id="two"></button>
        <button id="three"></button>
        <button id="four"></button>
        <button id="five"></button>
        <button id="six"></button>
        <button id="seven"></button>
        <button id="eight"></button>
        <button id="nine"></button>
    </div>
    <p id="winMsg"></p>
    <button id="restart" hidden>Restart Game</button>
    <script src="script.js"></script>
</body>
</html>
